general {
    col.active_border = rgba({{colors.outline.default.hex_stripped}}AA)
    col.inactive_border = rgba({{colors.outline_variant.default.hex_stripped}}AA)
}

misc {
    background_color = rgba({{colors.surface.default.hex_stripped}}FF)
}

plugin {
    hyprbars {
        bar_height = 34
        bar_color = rgba({{colors.surface.default.hex_stripped}}FF)
        col.text = rgba({{colors.on_surface.default.hex_stripped}}FF)
        bar_text_size = 10
        bar_text_font = Google Sans Flex
        bar_button_padding = 6
        bar_padding = 10
        bar_precedence_over_border = true
        bar_buttons_alignment = left

        # Red (Close) - With Black Icon () - Action: killactive
        hyprbars-button = rgb(e06c75), 12, , hyprctl dispatch killactive, rgba({{colors.surface.default.hex_stripped}}FF)
        # Yellow (Max) - With Black Outline Icon () - Action: fullscreen 1
        hyprbars-button = rgb(e5c07b), 12, , hyprctl dispatch fullscreen 1, rgba({{colors.surface.default.hex_stripped}}FF)
        # Blue (Float) - With Black Icon () - Action: togglefloating
        hyprbars-button = rgb(61afef), 12, , hyprctl dispatch togglefloating, rgba({{colors.surface.default.hex_stripped}}FF)
    }
}

windowrulev2 = bordercolor rgba({{colors.primary.default.hex_stripped}}AA) rgba({{colors.primary.default.hex_stripped}}77),pinned:1
